site_name: ili2py Documentation
docs_dir: mkdocs
extra_css:
  - style.css
repo_name: rudert-geoinformatik/ili2py
repo_url: https://github.com/rudert-geoinformatik/ili2py
edit_uri: https://github.com/rudert-geoinformatik/ili2py/tree/master/docs/
nav:
  - "Home": index.md
  - "User Guide":
      - "Get started": user_guide/start.md
      - "Diagrams": user_guide/diagram.md
      - "Python Classes": user_guide/python_classes.md
      - "CLI Reference": user_guide/cli-reference.md
      - "CLI Binary usage": user_guide/cli-binary.md
  - "Feature Status":
      - "Overview": feature_status/index.md
      - "Reading IlisMeta16": feature_status/ilismeta16.md
      - "Index Mapper":  feature_status/index_mapper.md
      - "Python Classes":  feature_status/python_classes.md
      - "Diagrams":  feature_status/diagrams.md
      - "Open Questions": feature_status/questions.md
  - "Documents":
      - "Overview": documents/overview.md
      - "Report (Nov '23)": documents/report/report.md
  - "DEV Guide":
      - "Python Classes usage": dev_guide/python_classes.md
  - Code: reference/

theme:
  name: material
  logo: assets/img/logo.1.svg
  favicon: assets/img/logo.1.svg
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - autorefs
  - mermaid2
  - gen-files:
      scripts:
        - scripts/gen_ref_pages.py
  - glightbox:
      auto_caption: true       # Untertitel automatisch aus dem Bildtitel
      touchNavigation: true
      loop: true
      effect: zoom
  - literate-nav:
      nav_file: SUMMARY.md
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            docstring_section_style: list
            show_submodules: true
            show_if_no_docstring: true
            show_signature: true
            show_signature_annotations: true
            show_bases: true
            show_root_heading: true
            show_root_full_path: false
            docstring_style: google  # optional

  - section-index


markdown_extensions:
  - admonition   # for snippets
  - attr_list
  - mkdocs-click
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
