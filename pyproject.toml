# BUILD

[build-system]

requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

# Information required for building (sdist/wheel)
## Also renders on pypi as 'subtitle'
[project]
name = "interlis2py"
dynamic = ["version", "readme"]
description = "Your pythonic gateway to INTERLIS"
authors = [
    {name="Clemens Rudert", email="rudert-geoinformatik@posteo.ch"}
]
requires-python = ">=3.12.0"
maintainers = [
    {name="Clemens Rudert", email="rudert-geoinformatik@posteo.ch"}
]
# license = "AGPL-3.0-only"
urls.Tracker = "https://github.com/georama/issues"
urls.CI = "https://github.com/rudert-geoinformatik/ili2py/actions"
urls.Documentation = "https://ili2py.readthedocs.io/"
urls.Source = "https://github.com/rudert-geoinformatik/ili2py"
urls.Changelog = "https://github.com/rudert-geoinformatik/ili2py/blob/master/CHANGELOG.md"
urls.Contributing = "https://github.com/rudert-geoinformatik/ili2py/blob/master/CONTRIBUTING.md"

keywords = [
    "python package",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Natural Language :: English",
    "Operating System :: Unix",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Software Distribution",
    "Typing :: Typed"
]

### Dependency Constraints, aka Requirements ###
dependencies = [
    "click==8.1.8",
    "xsdata[cli,lxml,soap]>=26.10",
    # formatting of the generated python code (writers/py/render.py)
    "autoflake==2.4.0",
    "black==25.1.0",
    "isort==6.0.1",
    # logging
    "rich"
]

[project.scripts]
ili2py = "ili2py.cli:cli"

[dependency-groups]
dev = [
    "pre-commit==4.1.0",
    "pyinstaller",
    "ruff==0.17.1",
    "mypy==1.18.2"
]
# Test: packages imported in test code and packages required for the "test runner"
test = [
    "pytest>=6.2.4",
    "pytest-cov>=2.12",
    "pytest-explicit~=1.0.1",
    "pytest-xdist>=1.34",
    "pytest-click>=1.1.0",
    "pytest-run-subprocess==0.10.0",
    "pytest-resource-path==1.4.0"
]
# Docs: dev and build dependencies
docs = [
    "pillow==12.0.0",
    "cairosvg==2.8.2",
    "zensical==0.0.71",
    "mkdocs-api-autonav==0.4.0",
    "mkdocstrings==1.0.7",
    "mkdocstrings-python==2.0.9",
    "mkdocs-autorefs==1.4.4",
    "mkdocs-click==0.9.0",
    "mkdocs-glightbox==0.5.2",
]

[tool.setuptools.dynamic]
readme = {file = ["README.md", "CHANGELOG.md"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
version_file = "src/ili2py/_version.py"

# TOOLS
[tool.pytest.ini_options]
minversion = "6.2"
addopts = "--strict-markers"
markers = [
    "slow: Marks a slow test",
    "integration: Integration Tests",
    "network_bound: Require internet connection",
    "e2e: End-to-end tests (IMD -> python classes -> XTF -> ilivalidator), require java and ilivalidator",
]
testpaths = [
    "tests",
]
explicit-only = [
    "integration",
    "network_bound",
    "e2e",
]
"resource-path.directory-name-test-resources" = "data"


[tool.ruff]
line-length = 95
target-version = "py312"
exclude = [
    "tests/**",
    "src/ili2py/interfaces/interlis/interlis_24/ilismeta/**",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "UP",   # pyupgrade replacement
    "B",    # bugbear
    "SIM",  # simplify
    "I",    # isort
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
# copied verbatim into the generated output; Expression is ABSTRACT in IlisMeta16
"src/ili2py/writers/py/constraints.py" = ["B024"]

[tool.coverage.run]
source = ["ili2py"]

[tool.coverage.report]
show_missing = true
precision = 2
omit = ["*migrations*"]
exclude_lines = [
    "raise NotImplementedError",
    "raise NotImplemented",
]

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
show_error_codes = true

[[tool.mypy.overrides]]
# no stubs available; PIL and cairosvg are only installed with the docs group
module = ["autoflake", "cairosvg", "PIL", "PIL.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# INTERLIS 2.3 XTF reader: broken since the IMD reader switched to xsdata (d285e48), it is
# written against the old hand-written ModelData. To be rewritten, see PLAN-interlis23-reader.md
module = [
    "ili2py.interfaces.interlis.interlis_23.generator",
    "ili2py.readers.interlis_23.xtf.xsdata",
]
ignore_errors = true
